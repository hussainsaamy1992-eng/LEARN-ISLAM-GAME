<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEARN ISLAM - ކުޑަކުދިންގެ އިސްލާމީ ގޭމް</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js and GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <div class="top-bar interactive">
      <div class="game-title">LEARN ISLAM - އިސްލާމް ދަސްކުރަމާ</div>
      <div class="stats">
        <span id="player-display">ވަނުން: މެހެމާން</span>
        <span id="timer-display">ވަގުތު: 00:00</span>
      </div>
    </div>

    <div class="controls-hint">
      ހިނގުމަށް: ކީބޯޑު އެރޯ ކީތައް (W, A, S, D ނުވަތަ Arrow Keys) ބޭނުންކުރައްވާ
    </div>
  </div>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-card">
    <h2>އިސްލާމީ ގޭމަށް މަރުޙަބާ</h2>
    <input type="text" id="username" placeholder="ޔޫޒަރނޭމް ޖައްސަވާ">
    <input type="password" id="password" placeholder="ޕާސްވޯޑް ޖައްސަވާ">
    <button id="login-btn">ވަންނަވާ</button>
    <button id="guest-btn" style="background:#757575;">މެހެމާނެއްގެ ގޮތުގައި ފައްޓަވާ</button>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. CONFIGURATION & TIMER
    // -------------------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEBcmkLOcdzXpJArO8_0ifdY_iGIAQGS4I2zDaM11S9xHwQvcU_GHxibo6a4r_E9G6/exec";

    let currentUser = null;
    let secondsElapsed = 0;
    setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer-display').innerText = `ވަގުތު: ${mins}:${secs}`;
    }, 1000);

    // -------------------------------------------------------------
    // 2. SCENE, SKY & LIGHTING
    // -------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7fc7ea);
    scene.fog = new THREE.FogExp2(0x7fc7ea, 0.005);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3d7026, 0.85);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.4);
    sunLight.position.set(40, 70, 30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 150;
    sunLight.shadow.camera.left = -25;
    sunLight.shadow.camera.right = 25;
    sunLight.shadow.camera.top = 25;
    sunLight.shadow.camera.bottom = -25;
    scene.add(sunLight);

    // -------------------------------------------------------------
    // 3. PROCEDURAL REALISTIC GRASS TEXTURE & VAST GROUND
    // -------------------------------------------------------------
    function createGrassCanvas() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      // Base soil/dark green
      ctx.fillStyle = '#396b27';
      ctx.fillRect(0, 0, 512, 512);

      // Procedural grass blade noise
      for (let i = 0; i < 40000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const len = 3 + Math.random() * 8;
        const greens = ['#49852f', '#5ca33a', '#6dbd45', '#336122', '#7ecb4f'];
        ctx.strokeStyle = greens[Math.floor(Math.random() * greens.length)];
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + (Math.random() - 0.5) * 4, y - len);
        ctx.stroke();
      }
      return new THREE.CanvasTexture(c);
    }

    const grassTex = createGrassCanvas();
    grassTex.wrapS = THREE.RepeatWrapping;
    grassTex.wrapT = THREE.RepeatWrapping;
    grassTex.repeat.set(80, 80);

    const groundGeo = new THREE.PlaneGeometry(800, 800);
    const groundMat = new THREE.MeshLambertMaterial({ map: grassTex });
    const fullGround = new THREE.Mesh(groundGeo, groundMat);
    fullGround.rotation.x = -Math.PI / 2;
    fullGround.position.y = 0;
    fullGround.receiveShadow = true;
    scene.add(fullGround);

    // -------------------------------------------------------------
    // 4. LOAD ASSETS (FIX WAIST SINKING ISSUE)
    // -------------------------------------------------------------
    const loader = new THREE.GLTFLoader();
    
    // Character root handles world positioning & rotation
    const playerRoot = new THREE.Group();
    scene.add(playerRoot);
    
    let kidInner = null;
    let mixer = null;
    let walkAction = null;
    let hasBuiltinAnim = false;
    let baseFootOffset = 0;

    // Load Garden Props & Scatter Several Clumps
    loader.load('garden.glb', (gltf) => {
      const gardenOrigin = gltf.scene;
      gardenOrigin.traverse((n) => { if (n.isMesh) n.receiveShadow = true; });

      // Place a few natural clumps around the landscape
      const positions = [
        { x: 0, z: 0, s: 4 },
        { x: -18, z: 12, s: 3.5 },
        { x: 22, z: -10, s: 3.8 },
        { x: -12, z: -25, s: 4.2 },
        { x: 20, z: 22, s: 3.2 }
      ];

      positions.forEach((p, idx) => {
        const clump = (idx === 0) ? gardenOrigin : gardenOrigin.clone();
        clump.scale.set(p.s, p.s, p.s);
        clump.position.set(p.x, 0, p.z);
        scene.add(clump);
      });
    }, undefined, (e) => {
      console.log("No garden.glb found; relying on procedural grass terrain.");
    });

    // Load Kid Character
    loader.load('kid.glb', (gltf) => {
      kidInner = gltf.scene;

      // Ensure all transforms and matrices update before measuring
      kidInner.updateMatrixWorld(true);

      // Measure original bounding box
      let box = new THREE.Box3().setFromObject(kidInner);
      let origHeight = box.max.y - box.min.y;

      // Scale character to standard human child height (~2.2 units)
      const targetHeight = 2.2;
      const scaleFactor = targetHeight / (origHeight || 1);
      kidInner.scale.set(scaleFactor, scaleFactor, scaleFactor);

      // Recalculate bounding box with new scale
      kidInner.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(kidInner);

      // Force the lowest vertex of the feet to rest exactly at Y = 0
      baseFootOffset = -box.min.y;
      kidInner.position.y = baseFootOffset;

      kidInner.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
        }
      });

      playerRoot.add(kidInner);

      // Check for built-in skeletal animations
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(kidInner);
        const clip = gltf.animations.find(a => 
          a.name.toLowerCase().includes('walk') || 
          a.name.toLowerCase().includes('run')
        ) || gltf.animations[0];

        walkAction = mixer.clipAction(clip);
        hasBuiltinAnim = true;
      }
    });

    // -------------------------------------------------------------
    // 5. MOVEMENT, KEYBOARD CONTROLS & CAMERA
    // -------------------------------------------------------------
    const keys = {
      w: false, a: false, s: false, d: false,
      ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false
    };

    window.addEventListener('keydown', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    const clock = new THREE.Clock();
    const moveSpeed = 5.5;   // walking units/sec
    const turnSpeed = 3.2;   // radians/sec
    let walkStepTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (mixer) mixer.update(delta);

      if (playerRoot && kidInner) {
        let isMoving = false;

        // Turning
        if (keys.a || keys.ArrowLeft) {
          playerRoot.rotation.y += turnSpeed * delta;
        }
        if (keys.d || keys.ArrowRight) {
          playerRoot.rotation.y -= turnSpeed * delta;
        }

        // Forward / Backward
        if (keys.w || keys.ArrowUp) {
          playerRoot.translateZ(moveSpeed * delta);
          isMoving = true;
        }
        if (keys.s || keys.ArrowDown) {
          playerRoot.translateZ(-moveSpeed * 0.55 * delta);
          isMoving = true;
        }

        // Keep player root anchored to ground plane
        playerRoot.position.y = 0;

        // Walking Gait Dynamics
        if (hasBuiltinAnim && walkAction) {
          if (isMoving) {
            if (!walkAction.isRunning()) walkAction.play();
          } else {
            walkAction.stop();
          }
        } else if (!hasBuiltinAnim) {
          // Realistic step bobbing that always returns to base foot level
          if (isMoving) {
            walkStepTime += delta * 11;
            kidInner.position.y = baseFootOffset + Math.abs(Math.sin(walkStepTime)) * 0.12;
            kidInner.rotation.z = Math.sin(walkStepTime * 0.5) * 0.05;
          } else {
            kidInner.position.y = THREE.MathUtils.lerp(kidInner.position.y, baseFootOffset, 0.15);
            kidInner.rotation.z = THREE.MathUtils.lerp(kidInner.rotation.z, 0, 0.15);
          }
        }

        // Smooth camera follow
        const cameraOffset = new THREE.Vector3(0, 3.2, -6.0);
        cameraOffset.applyMatrix4(playerRoot.matrixWorld);
        camera.position.lerp(cameraOffset, 0.08);

        camera.lookAt(
          playerRoot.position.x,
          playerRoot.position.y + 1.3,
          playerRoot.position.z
        );

        // Position sunlight above player for clean shadow projection
        sunLight.position.set(
          playerRoot.position.x + 35,
          70,
          playerRoot.position.z + 25
        );
        sunLight.target = playerRoot;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // -------------------------------------------------------------
    // 6. LOGIN / AUTHENTICATION MODAL
    // -------------------------------------------------------------
    document.getElementById('guest-btn').addEventListener('click', () => {
      document.getElementById('login-modal').classList.add('hidden');
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if (!user || !pass) {
        alert("ޔޫޒަރނޭމް އަދި ޕާސްވޯޑް ޖައްސަވާ!");
        return;
      }

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username: user, password: pass })
        });
        const data = await res.json();
        if (data.success) {
          currentUser = data.user;
          document.getElementById('player-display').innerText = `ވަނުން: ${data.user.username} (${data.user.school})`;
          document.getElementById('login-modal').classList.add('hidden');
        } else {
          alert(data.message || "ވަނުމުގައި މައްސަލައެއް ދިމާވެއްޖެ");
        }
      } catch (err) {
        document.getElementById('login-modal').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
