<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEARN ISLAM - ކުޑަކުދިންގެ އިސްލާމީ ގޭމް</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js and GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <div class="top-bar interactive">
      <div class="game-title">LEARN ISLAM - އިސްލާމް ދަސްކުރަމާ</div>
      <div class="stats">
        <span id="player-display">ވަނުން: މެހެމާން</span>
        <span id="timer-display">ވަގުތު: 00:00</span>
      </div>
    </div>

    <div class="controls-hint">
      ހިނގުމަށް: (W, A, S, D) | ކެމެރާ 360° ބެލުމަށް: މައުސް ޑްރެގް ކުރައްވާ
    </div>
  </div>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-card">
    <h2>އިސްލާމީ ގޭމަށް މަރުޙަބާ</h2>
    <input type="text" id="username" placeholder="ޔޫޒަރނޭމް ޖައްސަވާ">
    <input type="password" id="password" placeholder="ޕާސްވޯޑް ޖައްސަވާ">
    <button id="login-btn">ވަންނަވާ</button>
    <button id="guest-btn" style="background:#757575;">މެހެމާނެއްގެ ގޮތުގައި ފައްޓަވާ</button>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. CONFIGURATION & TIMER
    // -------------------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEBcmkLOcdzXpJArO8_0ifdY_iGIAQGS4I2zDaM11S9xHwQvcU_GHxibo6a4r_E9G6/exec";

    let currentUser = null;
    let secondsElapsed = 0;
    setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer-display').innerText = `ވަގުތު: ${mins}:${secs}`;
    }, 1000);

    // -------------------------------------------------------------
    // 2. HIGH-PERFORMANCE 60 FPS RENDERER & SCENE SETUP
    // -------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x82cbef);
    scene.fog = new THREE.FogExp2(0x82cbef, 0.006);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 800);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    // Optimized Lighting (Reduces GPU Draw Calls)
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3d7026, 0.85);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
    sunLight.position.set(30, 50, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 100;
    sunLight.shadow.camera.left = -20;
    sunLight.shadow.camera.right = 20;
    sunLight.shadow.camera.top = 20;
    sunLight.shadow.camera.bottom = -20;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // -------------------------------------------------------------
    // 3. FAST REALISTIC GRASS TERRAIN (NO LAG)
    // -------------------------------------------------------------
    function createOptimizedGrassTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#325e22';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 20000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const h = 4 + Math.random() * 10;
        ctx.strokeStyle = ['#437d2f', '#569b3d', '#6abf4b', '#2c531e'][Math.floor(Math.random() * 4)];
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + (Math.random() - 0.5) * 3, y - h);
        ctx.stroke();
      }
      return new THREE.CanvasTexture(c);
    }

    const grassTex = createOptimizedGrassTexture();
    grassTex.wrapS = THREE.RepeatWrapping;
    grassTex.wrapT = THREE.RepeatWrapping;
    grassTex.repeat.set(60, 60);

    const groundGeo = new THREE.PlaneGeometry(600, 600);
    const groundMat = new THREE.MeshLambertMaterial({ map: grassTex });
    const fullGround = new THREE.Mesh(groundGeo, groundMat);
    fullGround.rotation.x = -Math.PI / 2;
    fullGround.position.y = 0;
    fullGround.receiveShadow = true;
    scene.add(fullGround);

    // -------------------------------------------------------------
    // 4. LOAD ASSETS & ACCURATE LEG IDENTIFICATION
    // -------------------------------------------------------------
    const loader = new THREE.GLTFLoader();
    
    const playerRoot = new THREE.Group();
    scene.add(playerRoot);
    
    let kidInner = null;
    let mixer = null;
    let walkAction = null;
    let hasBuiltinAnim = false;
    let baseFootOffset = 0;

    // Bone references for realistic manual leg swings if no animation clip exists
    let leftLegBone = null;
    let rightLegBone = null;

    // Load Garden Props - Lightweight controlled placement to prevent lag
    loader.load('garden.glb', (gltf) => {
      const gardenOrigin = gltf.scene;
      gardenOrigin.traverse((n) => { 
        if (n.isMesh) {
          n.receiveShadow = true;
        }
      });

      // Scatter a balanced number of decorative bushes around the terrain
      const clumpLocations = [
        { x: 3, z: 4, s: 3.5 },
        { x: -8, z: 10, s: 3.0 },
        { x: 14, z: -8, s: 3.8 },
        { x: -16, z: -14, s: 4.0 },
        { x: 20, z: 18, s: 3.2 },
        { x: -22, z: 6, s: 3.5 },
        { x: 8, z: -20, s: 3.6 },
        { x: -12, z: 24, s: 3.4 },
        { x: 25, z: -15, s: 3.0 }
      ];

      clumpLocations.forEach((loc) => {
        const clump = gardenOrigin.clone();
        clump.scale.set(loc.s, loc.s, loc.s);
        clump.position.set(loc.x, 0, loc.z);
        scene.add(clump);
      });
    }, undefined, (e) => {
      console.log("Using procedural grass ground.");
    });

    // Load Kid Character
    loader.load('kid.glb', (gltf) => {
      kidInner = gltf.scene;
      kidInner.updateMatrixWorld(true);

      let box = new THREE.Box3().setFromObject(kidInner);
      let origHeight = box.max.y - box.min.y;

      const targetHeight = 2.2;
      const scaleFactor = targetHeight / (origHeight || 1);
      kidInner.scale.set(scaleFactor, scaleFactor, scaleFactor);

      kidInner.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(kidInner);

      // Lock bottom-most vertices precisely to Y = 0 (Feet never sink)
      baseFootOffset = -box.min.y;
      kidInner.position.y = baseFootOffset;

      kidInner.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
        }
        // Search for leg/thigh bones in model hierarchy
        if (node.isBone) {
          const name = node.name.toLowerCase();
          if (name.includes('left') && (name.includes('leg') || name.includes('thigh') || name.includes('upleg'))) {
            leftLegBone = node;
          }
          if (name.includes('right') && (name.includes('leg') || name.includes('thigh') || name.includes('upleg'))) {
            rightLegBone = node;
          }
        }
      });

      playerRoot.add(kidInner);

      // Check if model came with an existing animated walk cycle
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(kidInner);
        const clip = gltf.animations.find(a => 
          a.name.toLowerCase().includes('walk') || 
          a.name.toLowerCase().includes('run')
        ) || gltf.animations[0];

        walkAction = mixer.clipAction(clip);
        hasBuiltinAnim = true;
      }
    });

    // -------------------------------------------------------------
    // 5. 360° MOUSE & TOUCHPAD CAMERA CONTROLS
    // -------------------------------------------------------------
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;

    let cameraAngleH = 0;     // Horizontal angle
    let cameraAngleV = 0.32;  // Vertical pitch
    let cameraDistance = 6.5; // Distance behind girl

    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#login-modal') || e.target.closest('.interactive')) return;
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - prevMouseX;
      const deltaY = e.clientY - prevMouseY;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;

      cameraAngleH -= deltaX * 0.0055;
      cameraAngleV += deltaY * 0.0045;
      cameraAngleV = Math.max(0.05, Math.min(Math.PI / 2.3, cameraAngleV));
    });

    // Touchpad / touch screen support
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1 && !e.target.closest('#login-modal')) {
        isDragging = true;
        prevMouseX = e.touches[0].clientX;
        prevMouseY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', () => { isDragging = false; });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const deltaX = e.touches[0].clientX - prevMouseX;
      const deltaY = e.touches[0].clientY - prevMouseY;
      prevMouseX = e.touches[0].clientX;
      prevMouseY = e.touches[0].clientY;

      cameraAngleH -= deltaX * 0.007;
      cameraAngleV += deltaY * 0.005;
      cameraAngleV = Math.max(0.05, Math.min(Math.PI / 2.3, cameraAngleV));
    }, { passive: true });

    // Zoom
    window.addEventListener('wheel', (e) => {
      cameraDistance += e.deltaY * 0.004;
      cameraDistance = Math.max(3.5, Math.min(12.0, cameraDistance));
    });

    // -------------------------------------------------------------
    // 6. REALISTIC WALKING CONTROLS (NO HOPPING)
    // -------------------------------------------------------------
    const keys = {
      w: false, a: false, s: false, d: false,
      ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false
    };

    window.addEventListener('keydown', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    const clock = new THREE.Clock();
    const moveSpeed = 5.0; // Realistic walking pace
    let walkStepTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (mixer) mixer.update(delta);

      if (playerRoot && kidInner) {
        let moveX = 0;
        let moveZ = 0;

        if (keys.w || keys.ArrowUp) moveZ += 1;
        if (keys.s || keys.ArrowDown) moveZ -= 1;
        if (keys.a || keys.ArrowLeft) moveX += 1;
        if (keys.d || keys.ArrowRight) moveX -= 1;

        const isMoving = (moveX !== 0 || moveZ !== 0);

        if (isMoving) {
          const inputAngle = Math.atan2(moveX, moveZ);
          const targetRotation = cameraAngleH + inputAngle;

          const currentRotation = playerRoot.rotation.y;
          let diff = (targetRotation - currentRotation) % (Math.PI * 2);
          if (diff < -Math.PI) diff += Math.PI * 2;
          if (diff > Math.PI) diff -= Math.PI * 2;
          playerRoot.rotation.y += diff * 0.16;

          playerRoot.position.x += Math.sin(targetRotation) * moveSpeed * delta;
          playerRoot.position.z += Math.cos(targetRotation) * moveSpeed * delta;
        }

        // Lock root to ground
        playerRoot.position.y = 0;

        // NATURAL WALKING MOVEMENT (NO RABBIT HOPPING)
        if (hasBuiltinAnim && walkAction) {
          if (isMoving) {
            if (!walkAction.isRunning()) walkAction.play();
          } else {
            walkAction.stop();
          }
        } else {
          // If the model has skeleton bones for legs, alternate forward/back leg swings
          if (isMoving) {
            walkStepTime += delta * 9.0;
            const legSwing = Math.sin(walkStepTime) * 0.45;

            if (leftLegBone && rightLegBone) {
              leftLegBone.rotation.x = legSwing;
              rightLegBone.rotation.x = -legSwing;
            }

            // Keep vertical position flat on the ground; subtle natural hip sway only
            kidInner.position.y = baseFootOffset;
            kidInner.rotation.z = Math.sin(walkStepTime) * 0.025;
            kidInner.rotation.y = Math.sin(walkStepTime) * 0.02;
          } else {
            // Smooth reset when stationary
            if (leftLegBone && rightLegBone) {
              leftLegBone.rotation.x = THREE.MathUtils.lerp(leftLegBone.rotation.x, 0, 0.2);
              rightLegBone.rotation.x = THREE.MathUtils.lerp(rightLegBone.rotation.x, 0, 0.2);
            }
            kidInner.position.y = baseFootOffset;
            kidInner.rotation.z = THREE.MathUtils.lerp(kidInner.rotation.z, 0, 0.2);
            kidInner.rotation.y = THREE.MathUtils.lerp(kidInner.rotation.y, 0, 0.2);
          }
        }

        // 360° Smooth Orbit Camera follow
        const camX = playerRoot.position.x - Math.sin(cameraAngleH) * Math.cos(cameraAngleV) * cameraDistance;
        const camY = playerRoot.position.y + Math.sin(cameraAngleV) * cameraDistance + 1.2;
        const camZ = playerRoot.position.z - Math.cos(cameraAngleH) * Math.cos(cameraAngleV) * cameraDistance;

        camera.position.set(camX, camY, camZ);
        camera.lookAt(playerRoot.position.x, playerRoot.position.y + 1.25, playerRoot.position.z);

        // Sunlight tracks player
        sunLight.position.set(
          playerRoot.position.x + 30,
          50,
          playerRoot.position.z + 20
        );
        sunLight.target = playerRoot;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // -------------------------------------------------------------
    // 7. LOGIN / AUTHENTICATION MODAL
    // -------------------------------------------------------------
    document.getElementById('guest-btn').addEventListener('click', () => {
      document.getElementById('login-modal').classList.add('hidden');
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if (!user || !pass) {
        alert("ޔޫޒަރނޭމް އަދި ޕާސްވޯޑް ޖައްސަވާ!");
        return;
      }

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username: user, password: pass })
        });
        const data = await res.json();
        if (data.success) {
          currentUser = data.user;
          document.getElementById('player-display').innerText = `ވަނުން: ${data.user.username} (${data.user.school})`;
          document.getElementById('login-modal').classList.add('hidden');
        } else {
          alert(data.message || "ވަނުމުގައި މައްސަލައެއް ދިމާވެއްޖެ");
        }
      } catch (err) {
        document.getElementById('login-modal').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
