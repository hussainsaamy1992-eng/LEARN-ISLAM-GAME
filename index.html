<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEARN ISLAM - ކުޑަކުދިންގެ އިސްލާމީ ގޭމް</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js and GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <div class="top-bar interactive">
      <div class="game-title">LEARN ISLAM - އިސްލާމް ދަސްކުރަމާ</div>
      <div class="stats">
        <span id="player-display">ވަނުން: މެހެމާން</span>
        <span id="timer-display">ވަގުތު: 00:00</span>
      </div>
    </div>

    <div class="controls-hint">
      ހިނގުމަށް: ކީބޯޑު އެރޯ ކީތައް (W, A, S, D ނުވަތަ Arrow Keys) ބޭނުންކުރައްވާ
    </div>
  </div>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-card">
    <h2>އިސްލާމީ ގޭމަށް މަރުޙަބާ</h2>
    <input type="text" id="username" placeholder="ޔޫޒަރނޭމް ޖައްސަވާ">
    <input type="password" id="password" placeholder="ޕާސްވޯޑް ޖައްސަވާ">
    <button id="login-btn">ވަންނަވާ</button>
    <button id="guest-btn" style="background:#757575;">މެހެމާނެއްގެ ގޮތުގައި ފައްޓަވާ</button>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. CONFIGURATION & TIMER
    // -------------------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEBcmkLOcdzXpJArO8_0ifdY_iGIAQGS4I2zDaM11S9xHwQvcU_GHxibo6a4r_E9G6/exec";

    let currentUser = null;
    let secondsElapsed = 0;
    setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer-display').innerText = `ވަގުތު: ${mins}:${secs}`;
    }, 1000);

    // -------------------------------------------------------------
    // 2. SCENE, ATMOSPHERE & LIGHTING
    // -------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Realistic Sky Blue
    scene.fog = new THREE.FogExp2(0x87CEEB, 0.007);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    // Ambient & Sunlight
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x446633, 0.85);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
    sunLight.position.set(30, 60, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 200;
    sunLight.shadow.camera.left = -30;
    sunLight.shadow.camera.right = 30;
    sunLight.shadow.camera.top = 30;
    sunLight.shadow.camera.bottom = -30;
    scene.add(sunLight);

    // -------------------------------------------------------------
    // 3. LARGE EXPANSIVE GROUND
    // -------------------------------------------------------------
    const groundGeo = new THREE.PlaneGeometry(600, 600);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x5a9e32 });
    const mainGround = new THREE.Mesh(groundGeo, groundMat);
    mainGround.rotation.x = -Math.PI / 2;
    mainGround.position.y = 0;
    mainGround.receiveShadow = true;
    scene.add(mainGround);

    // -------------------------------------------------------------
    // 4. LOAD 3D ASSETS (garden.glb & kid.glb)
    // -------------------------------------------------------------
    const loader = new THREE.GLTFLoader();
    
    // Player Character Rig Root
    const playerRoot = new THREE.Group();
    scene.add(playerRoot);
    
    let kidInnerModel = null;
    let mixer = null;
    let walkAction = null;
    let hasBuiltinAnim = false;

    // Load Garden Props / Ground Patch
    loader.load('garden.glb', (gltf) => {
      const garden = gltf.scene;
      garden.scale.set(6, 6, 6);
      garden.position.set(0, 0, 0);

      garden.traverse((node) => {
        if (node.isMesh) {
          node.receiveShadow = true;
        }
      });
      scene.add(garden);
    }, undefined, (err) => {
      console.log("No external garden.glb mesh loaded, running procedural terrain.");
    });

    // Load Girl Character & Align to Ground
    loader.load('kid.glb', (gltf) => {
      kidInnerModel = gltf.scene;

      // 1. Calculate bounding box to place feet exactly on ground level (Y = 0)
      const bbox = new THREE.Box3().setFromObject(kidInnerModel);
      const height = bbox.max.y - bbox.min.y;

      // Standardize size to 2 units tall
      const scaleFactor = 2.0 / (height || 1);
      kidInnerModel.scale.set(scaleFactor, scaleFactor, scaleFactor);

      // Re-calculate bounding box after scaling and shift base to 0
      const updatedBox = new THREE.Box3().setFromObject(kidInnerModel);
      kidInnerModel.position.y = -updatedBox.min.y;

      kidInnerModel.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
        }
      });

      playerRoot.add(kidInnerModel);

      // 2. Check for skeletal walking animations inside the model
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(kidInnerModel);
        const clip = gltf.animations.find(a => a.name.toLowerCase().includes('walk') || a.name.toLowerCase().includes('run')) || gltf.animations[0];
        walkAction = mixer.clipAction(clip);
        hasBuiltinAnim = true;
      }
    });

    // -------------------------------------------------------------
    // 5. MOVEMENT, KEYBOARD INPUT & PROCEDURAL ANIMATION
    // -------------------------------------------------------------
    const keys = {
      w: false, a: false, s: false, d: false,
      ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false
    };

    window.addEventListener('keydown', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    const clock = new THREE.Clock();
    const moveSpeed = 6.0;   // units/second
    const turnSpeed = 3.5;   // radians/second
    let walkCycle = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (mixer) mixer.update(delta);

      if (playerRoot && kidInnerModel) {
        let isMoving = false;

        // Turn character left / right
        if (keys.a || keys.ArrowLeft) {
          playerRoot.rotation.y += turnSpeed * delta;
        }
        if (keys.d || keys.ArrowRight) {
          playerRoot.rotation.y -= turnSpeed * delta;
        }

        // Move character forward / backward
        if (keys.w || keys.ArrowUp) {
          playerRoot.translateZ(moveSpeed * delta);
          isMoving = true;
        }
        if (keys.s || keys.ArrowDown) {
          playerRoot.translateZ(-moveSpeed * 0.5 * delta);
          isMoving = true;
        }

        // Lock root position strictly to ground plane
        playerRoot.position.y = 0;

        // Walking Animation Pipeline
        if (hasBuiltinAnim && walkAction) {
          if (isMoving) {
            if (!walkAction.isRunning()) walkAction.play();
          } else {
            walkAction.stop();
          }
        } else if (!hasBuiltinAnim) {
          // Realistic procedural walking gait: vertical bounce and weight shift
          if (isMoving) {
            walkCycle += delta * 12;
            kidInnerModel.position.y = (-new THREE.Box3().setFromObject(kidInnerModel).min.y) + Math.abs(Math.sin(walkCycle)) * 0.12;
            kidInnerModel.rotation.z = Math.sin(walkCycle * 0.5) * 0.05;
          } else {
            kidInnerModel.rotation.z = THREE.MathUtils.lerp(kidInnerModel.rotation.z, 0, 0.1);
          }
        }

        // Smooth camera follow system behind the character
        const cameraOffset = new THREE.Vector3(0, 3.2, -6.5);
        cameraOffset.applyMatrix4(playerRoot.matrixWorld);
        camera.position.lerp(cameraOffset, 0.08);

        camera.lookAt(
          playerRoot.position.x,
          playerRoot.position.y + 1.4,
          playerRoot.position.z
        );

        // Keep shadows sharp around player position
        sunLight.position.set(
          playerRoot.position.x + 30,
          60,
          playerRoot.position.z + 20
        );
        sunLight.target = playerRoot;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // -------------------------------------------------------------
    // 6. LOGIN & APPS SCRIPT API INTEGRATION
    // -------------------------------------------------------------
    document.getElementById('guest-btn').addEventListener('click', () => {
      document.getElementById('login-modal').classList.add('hidden');
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if (!user || !pass) {
        alert("ޔޫޒަރނޭމް އަދި ޕާސްވޯޑް ޖައްސަވާ!");
        return;
      }

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username: user, password: pass })
        });
        const data = await res.json();
        if (data.success) {
          currentUser = data.user;
          document.getElementById('player-display').innerText = `ވަނުން: ${data.user.username} (${data.user.school})`;
          document.getElementById('login-modal').classList.add('hidden');
        } else {
          alert(data.message || "ވަނުމުގައި މައްސަލައެއް ދިމާވެއްޖެ");
        }
      } catch (err) {
        document.getElementById('login-modal').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
