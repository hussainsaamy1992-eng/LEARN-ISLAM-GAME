<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEARN ISLAM - ކުޑަކުދިންގެ އިސްލާމީ ގޭމް</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js and GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <div class="top-bar interactive">
      <div class="game-title">LEARN ISLAM - އިސްލާމް ދަސްކުރަމާ</div>
      <div class="stats">
        <span id="player-display">ވަނުން: މެހެމާން</span>
        <span id="timer-display">ވަގުތު: 00:00</span>
      </div>
    </div>

    <div class="controls-hint">
      ހިނގުމަށް: (W, A, S, D) | ކެމެރާ 360° ބެލުމަށް: މައުސް ޑްރެގް ކުރައްވާ
    </div>
  </div>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-card">
    <h2>އިސްލާމީ ގޭމަށް މަރުޙަބާ</h2>
    <input type="text" id="username" placeholder="ޔޫޒަރނޭމް ޖައްސަވާ">
    <input type="password" id="password" placeholder="ޕާސްވޯޑް ޖައްސަވާ">
    <button id="login-btn">ވަންނަވާ</button>
    <button id="guest-btn" style="background:#757575;">މެހެމާނެއްގެ ގޮތުގައި ފައްޓަވާ</button>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. CONFIGURATION & TIMER
    // -------------------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEBcmkLOcdzXpJArO8_0ifdY_iGIAQGS4I2zDaM11S9xHwQvcU_GHxibo6a4r_E9G6/exec";

    let currentUser = null;
    let secondsElapsed = 0;
    setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer-display').innerText = `ވަގުތު: ${mins}:${secs}`;
    }, 1000);

    // -------------------------------------------------------------
    // 2. SCENE, SKY & LIGHTING
    // -------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7fc7ea);
    scene.fog = new THREE.FogExp2(0x7fc7ea, 0.005);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3d7026, 0.85);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.4);
    sunLight.position.set(40, 70, 30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 150;
    sunLight.shadow.camera.left = -30;
    sunLight.shadow.camera.right = 30;
    sunLight.shadow.camera.top = 30;
    sunLight.shadow.camera.bottom = -30;
    scene.add(sunLight);

    // Base Soil / Turf Bedding
    function createSoilCanvas() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#2f521f';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 15000; i++) {
        ctx.fillStyle = ['#385f26', '#264219', '#467231'][Math.floor(Math.random() * 3)];
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
      }
      return new THREE.CanvasTexture(c);
    }

    const groundTex = createSoilCanvas();
    groundTex.wrapS = THREE.RepeatWrapping;
    groundTex.wrapT = THREE.RepeatWrapping;
    groundTex.repeat.set(100, 100);

    const groundGeo = new THREE.PlaneGeometry(1000, 1000);
    const groundMat = new THREE.MeshLambertMaterial({ map: groundTex });
    const fullGround = new THREE.Mesh(groundGeo, groundMat);
    fullGround.rotation.x = -Math.PI / 2;
    fullGround.position.y = -0.05;
    fullGround.receiveShadow = true;
    scene.add(fullGround);

    // -------------------------------------------------------------
    // 3. LOAD ASSETS & FULL-AREA GRASS DISTRIBUTION
    // -------------------------------------------------------------
    const loader = new THREE.GLTFLoader();
    
    const playerRoot = new THREE.Group();
    scene.add(playerRoot);
    
    let kidInner = null;
    let mixer = null;
    let walkAction = null;
    let hasBuiltinAnim = false;
    let baseFootOffset = 0;

    // Load and carpet the area with garden clumps
    loader.load('garden.glb', (gltf) => {
      const gardenOrigin = gltf.scene;
      gardenOrigin.traverse((n) => { 
        if (n.isMesh) {
          n.receiveShadow = true; 
        }
      });

      // Scatter grass clumps in a dense patterned field
      const clumpSpacing = 7.5;
      const range = 70; // creates a carpet covering 140x140 meters around origin

      for (let x = -range; x <= range; x += clumpSpacing) {
        for (let z = -range; z <= range; z += clumpSpacing) {
          const clump = gardenOrigin.clone();
          // Jitter position, scale, and rotation so it looks natural
          const offsetX = x + (Math.random() - 0.5) * 3;
          const offsetZ = z + (Math.random() - 0.5) * 3;
          const scale = 3.6 + Math.random() * 1.4;

          clump.position.set(offsetX, 0, offsetZ);
          clump.rotation.y = Math.random() * Math.PI * 2;
          clump.scale.set(scale, scale, scale);
          scene.add(clump);
        }
      }
    }, undefined, (e) => {
      console.log("Using procedural grass ground.");
    });

    // Load Kid Character & Align to Ground
    loader.load('kid.glb', (gltf) => {
      kidInner = gltf.scene;
      kidInner.updateMatrixWorld(true);

      let box = new THREE.Box3().setFromObject(kidInner);
      let origHeight = box.max.y - box.min.y;

      const targetHeight = 2.2;
      const scaleFactor = targetHeight / (origHeight || 1);
      kidInner.scale.set(scaleFactor, scaleFactor, scaleFactor);

      kidInner.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(kidInner);

      baseFootOffset = -box.min.y;
      kidInner.position.y = baseFootOffset;

      kidInner.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
        }
      });

      playerRoot.add(kidInner);

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(kidInner);
        const clip = gltf.animations.find(a => 
          a.name.toLowerCase().includes('walk') || 
          a.name.toLowerCase().includes('run')
        ) || gltf.animations[0];

        walkAction = mixer.clipAction(clip);
        hasBuiltinAnim = true;
      }
    });

    // -------------------------------------------------------------
    // 4. 360° MOUSE & TOUCHPAD ORBIT CAMERA ENGINE
    // -------------------------------------------------------------
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;

    // Camera spherical coordinates
    let cameraAngleH = 0;     // Horizontal rotation (radians)
    let cameraAngleV = 0.35;  // Vertical pitch (radians)
    let cameraDistance = 7.0; // Distance behind player

    window.addEventListener('mousedown', (e) => {
      // Don't drag if interacting with UI modals
      if (e.target.closest('#login-modal') || e.target.closest('.interactive')) return;
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - prevMouseX;
      const deltaY = e.clientY - prevMouseY;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;

      // Rotate camera around girl
      cameraAngleH -= deltaX * 0.006;
      cameraAngleV += deltaY * 0.005;

      // Limit vertical pitch so camera cannot flip upside down
      cameraAngleV = Math.max(0.05, Math.min(Math.PI / 2.3, cameraAngleV));
    });

    // Touch controls for mobile / tablet trackpads
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1 && !e.target.closest('#login-modal')) {
        isDragging = true;
        prevMouseX = e.touches[0].clientX;
        prevMouseY = e.touches[0].clientY;
      }
    });

    window.addEventListener('touchend', () => { isDragging = false; });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const deltaX = e.touches[0].clientX - prevMouseX;
      const deltaY = e.touches[0].clientY - prevMouseY;
      prevMouseX = e.touches[0].clientX;
      prevMouseY = e.touches[0].clientY;

      cameraAngleH -= deltaX * 0.008;
      cameraAngleV += deltaY * 0.006;
      cameraAngleV = Math.max(0.05, Math.min(Math.PI / 2.3, cameraAngleV));
    });

    // Zoom in / out with mouse wheel
    window.addEventListener('wheel', (e) => {
      cameraDistance += e.deltaY * 0.005;
      cameraDistance = Math.max(3.5, Math.min(14.0, cameraDistance));
    });

    // -------------------------------------------------------------
    // 5. MOVEMENT CONTROLS & CAMERA-RELATIVE WALKING
    // -------------------------------------------------------------
    const keys = {
      w: false, a: false, s: false, d: false,
      ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false
    };

    window.addEventListener('keydown', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    const clock = new THREE.Clock();
    const moveSpeed = 6.0;
    let walkStepTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (mixer) mixer.update(delta);

      if (playerRoot && kidInner) {
        // Calculate input movement direction relative to camera angle
        let moveX = 0;
        let moveZ = 0;

        if (keys.w || keys.ArrowUp) moveZ += 1;
        if (keys.s || keys.ArrowDown) moveZ -= 1;
        if (keys.a || keys.ArrowLeft) moveX += 1;
        if (keys.d || keys.ArrowRight) moveX -= 1;

        const isMoving = (moveX !== 0 || moveZ !== 0);

        if (isMoving) {
          // Compute angle of movement relative to camera
          const inputAngle = Math.atan2(moveX, moveZ);
          const targetRotation = cameraAngleH + inputAngle;

          // Smoothly turn character toward walking direction
          const currentRotation = playerRoot.rotation.y;
          let diff = (targetRotation - currentRotation) % (Math.PI * 2);
          if (diff < -Math.PI) diff += Math.PI * 2;
          if (diff > Math.PI) diff -= Math.PI * 2;
          playerRoot.rotation.y += diff * 0.15;

          // Move forward in the direction of the movement vector
          playerRoot.position.x += Math.sin(targetRotation) * moveSpeed * delta;
          playerRoot.position.z += Math.cos(targetRotation) * moveSpeed * delta;
        }

        playerRoot.position.y = 0;

        // Animations
        if (hasBuiltinAnim && walkAction) {
          if (isMoving) {
            if (!walkAction.isRunning()) walkAction.play();
          } else {
            walkAction.stop();
          }
        } else if (!hasBuiltinAnim) {
          if (isMoving) {
            walkStepTime += delta * 11;
            kidInner.position.y = baseFootOffset + Math.abs(Math.sin(walkStepTime)) * 0.12;
            kidInner.rotation.z = Math.sin(walkStepTime * 0.5) * 0.05;
          } else {
            kidInner.position.y = THREE.MathUtils.lerp(kidInner.position.y, baseFootOffset, 0.15);
            kidInner.rotation.z = THREE.MathUtils.lerp(kidInner.rotation.z, 0, 0.15);
          }
        }

        // 360° Orbit Camera Position calculation
        const camX = playerRoot.position.x - Math.sin(cameraAngleH) * Math.cos(cameraAngleV) * cameraDistance;
        const camY = playerRoot.position.y + Math.sin(cameraAngleV) * cameraDistance + 1.2;
        const camZ = playerRoot.position.z - Math.cos(cameraAngleH) * Math.cos(cameraAngleV) * cameraDistance;

        camera.position.set(camX, camY, camZ);
        camera.lookAt(playerRoot.position.x, playerRoot.position.y + 1.3, playerRoot.position.z);

        // Keep sunlight and shadow area centered with character
        sunLight.position.set(
          playerRoot.position.x + 35,
          70,
          playerRoot.position.z + 25
        );
        sunLight.target = playerRoot;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // -------------------------------------------------------------
    // 6. LOGIN / AUTHENTICATION MODAL
    // -------------------------------------------------------------
    document.getElementById('guest-btn').addEventListener('click', () => {
      document.getElementById('login-modal').classList.add('hidden');
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if (!user || !pass) {
        alert("ޔޫޒަރނޭމް އަދި ޕާސްވޯޑް ޖައްސަވާ!");
        return;
      }

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username: user, password: pass })
        });
        const data = await res.json();
        if (data.success) {
          currentUser = data.user;
          document.getElementById('player-display').innerText = `ވަނުން: ${data.user.username} (${data.user.school})`;
          document.getElementById('login-modal').classList.add('hidden');
        } else {
          alert(data.message || "ވަނުމުގައި މައްސަލައެއް ދިމާވެއްޖެ");
        }
      } catch (err) {
        document.getElementById('login-modal').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
